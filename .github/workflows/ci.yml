name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      jpdfium-ref:
        description: JPDFium ref providing the safe jpdf_* core
        default: feat/native-safe-domain
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Until the safe API lands on JPDFium main, build the core from its feature branch.
  JPDFIUM_REF: ${{ github.event.inputs.jpdfium-ref || 'feat/native-safe-domain' }}

jobs:
  unit:
    name: Unit (no natives) / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8"
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/unit -q

  native-linux:
    name: Real native core / linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: Stirling-Tools/JPDFium
          ref: ${{ env.JPDFIUM_REF }}
          path: jpdfium
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libpcre2-dev libfreetype6-dev libharfbuzz-dev libicu-dev \
            libqpdf-dev libpugixml-dev libunibreak-dev lld patchelf libgl1 poppler-utils icu-devtools

      - name: Fetch pinned PDFium and verify its published digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(grep -v '^#' jpdfium/native/pdfium.version | grep -v '^$' | head -n1)
          ASSET=pdfium-linux-x64.tar.gz
          gh release download "$TAG" -R Stirling-Tools/JPDFium -p "$ASSET" -D "$RUNNER_TEMP"
          DIGEST=$(gh api "repos/Stirling-Tools/JPDFium/releases/tags/$TAG" \
            --jq ".assets[] | select(.name == \"$ASSET\") | .digest")
          echo "${DIGEST#sha256:}  $RUNNER_TEMP/$ASSET" | sha256sum -c -
          mkdir -p jpdfium/native/pdfium
          tar -xzf "$RUNNER_TEMP/$ASSET" -C jpdfium/native/pdfium

      # The optional OCR module: ONNX Runtime and the model profile, each pinned by digest.
      - name: Fetch ONNX Runtime and the OCR profile (pinned)
        run: |
          bash jpdfium/native/ocr/fetch-onnxruntime.sh linux-x64
          python jpdfium/native/ocr/tools/fetch_profile.py \
            jpdfium/native/ocr/profiles/pp-ocrv6-small.profile "$RUNNER_TEMP/ocr-profile"

      - name: Build the JPDFium core
        run: bash jpdfium/native/build-real.sh

      - name: Native core tests
        env:
          JPDFIUM_OCR_PROFILE: ${{ runner.temp }}/ocr-profile
        run: ctest --test-dir jpdfium/native/build-real --output-on-failure

      # One layout for tests and wheels: own sonames, with the OCR module beside the core.
      - name: Stage the natives for Python
        run: python tools/stage_natives.py jpdfium/native/dist/linux-x64 "$RUNNER_TEMP/natives"

      - name: Build pyjpdfium
        env:
          JPDFIUM_NATIVE_DIR: ${{ runner.temp }}/natives
          JPDFIUM_INCLUDE_DIR: ${{ github.workspace }}/jpdfium/native/bridge/include
        run: |
          python -m pip install "scikit-build-core>=0.11" "nanobind>=2.9" "pytest>=8"
          python -m pip wheel --no-build-isolation --no-deps . -w "$RUNNER_TEMP/wheel"
          python -m pip install --no-deps "$RUNNER_TEMP"/wheel/pyjpdfium-*.whl

      - name: Python tests (unit + native)
        env:
          PYJPDFIUM_NATIVE_DIR: ${{ runner.temp }}/natives
          PYJPDFIUM_OCR_PROFILE: ${{ runner.temp }}/ocr-profile
        run: |
          # Native tests skip when the extension is missing; fail loudly here instead.
          python -c "import pyjpdfium; print(pyjpdfium.runtime_info())"
          python -m pytest -q -rs

      - name: Parity with OCRmyPDF and independent text extractors
        env:
          PYJPDFIUM_NATIVE_DIR: ${{ runner.temp }}/natives
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tests/parity/requirements.txt
          export PYJPDFIUM_PARITY_SRC="$(python tests/parity/fetch_reference.py "$RUNNER_TEMP/parity")"
          python -m pytest tests/parity -q -rs

      - name: OCR parity with the official PaddleOCR pipeline
        env:
          PYJPDFIUM_NATIVE_DIR: ${{ runner.temp }}/natives
          PYJPDFIUM_OCR_PROFILE: ${{ runner.temp }}/ocr-profile
          PYJPDFIUM_OCR_REFERENCE: ${{ runner.temp }}/ocr-reference/bin/python
        run: |
          python -m venv "$RUNNER_TEMP/ocr-reference"
          "$RUNNER_TEMP/ocr-reference/bin/pip" install --require-hashes --only-binary=:all: \
            -r tests/parity/ocr-requirements.txt
          python -m pytest tests/parity/test_ocr_parity.py -q -rs

      - name: OCRmyPDF end to end with the pyjpdfium plugin
        env:
          PYJPDFIUM_NATIVE_DIR: ${{ runner.temp }}/natives
          PYJPDFIUM_OCR_PROFILE: ${{ runner.temp }}/ocr-profile
          PYJPDFIUM_OCRMYPDF_PYTHON: ${{ runner.temp }}/ocrmypdf/bin/python
        run: |
          python -m venv "$RUNNER_TEMP/ocrmypdf"
          "$RUNNER_TEMP/ocrmypdf/bin/pip" install --require-hashes --only-binary=:all: \
            -r tests/ocrmypdf/requirements.txt
          "$RUNNER_TEMP/ocrmypdf/bin/pip" install --no-deps "$RUNNER_TEMP"/wheel/pyjpdfium-*.whl
          python -m pytest tests/ocrmypdf tests/native/test_cli.py -q -rs

      # The release closure: JPDFium's bundler and checks, then a fresh Ubuntu with no network.
      - name: Wheel on a clean offline machine
        run: |
          bash jpdfium/native/build-minimal-icu.sh
          python tools/build_wheel.py jpdfium "$RUNNER_TEMP/wheelhouse"
          python -m pip download --require-hashes --only-binary=:all: \
            -r tests/ocrmypdf/requirements.txt -d "$RUNNER_TEMP/ocrmypdf-wheels"
          printf 'FROM ubuntu:24.04\nRUN apt-get update && apt-get install -y --no-install-recommends python3 python3-venv && rm -rf /var/lib/apt/lists/*\n' \
            | docker build -t pyjpdfium-clean -
          docker run --rm --network=none -v "$RUNNER_TEMP:/ci:ro" -v "$PWD:/src:ro" \
            -e PYJPDFIUM_OCR_PROFILE=/ci/ocr-profile pyjpdfium-clean bash -c '
              set -e
              python3 -m venv /tmp/venv
              /tmp/venv/bin/pip install -q --no-index /ci/wheelhouse/pyjpdfium-*.whl
              /tmp/venv/bin/pip install -q --no-index --require-hashes --only-binary=:all: \
                --find-links /ci/ocrmypdf-wheels -r /src/tests/ocrmypdf/requirements.txt
              cd /tmp && /tmp/venv/bin/python -I /src/tests/clean_machine/check.py
              bash /src/tests/clean_machine/prune.sh /ci/wheelhouse/pyjpdfium-*.whl \
                /ci/ocrmypdf-wheels /src/tests/ocrmypdf/requirements.txt \
                /src/tests/clean_machine/check.py'
